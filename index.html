
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d12">
<meta name="description" content="Un pequeño detalle hecho con mucho amor.">
<title>Feliz primer mes, mi amor ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

html,body{
margin:0;width:100%;min-height:100%;
background:#100d12;color:#fff;
font-family:'Cormorant Garamond',Georgia,serif;
}

body{overflow:hidden}

.scene{
position:relative;
isolation:isolate;
display:grid;
place-items:center;
width:100%;
min-height:100svh;
overflow:hidden;
background:#100d12;
}

/* VIDEO DE FONDO */

.scene video{
position:fixed;
z-index:-4;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
filter:brightness(.64) saturate(.82);
}

.shade{
position:fixed;
z-index:-3;
inset:0;
background:
linear-gradient(180deg,rgba(10,8,12,.38),rgba(16,10,16,.15) 40%,rgba(10,8,12,.76)),
radial-gradient(ellipse at center,transparent 15%,rgba(10,8,12,.35) 100%);
}

.grain{
position:fixed;
z-index:-2;
inset:0;
pointer-events:none;
opacity:.10;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
}

/* PANTALLA DE BIENVENIDA */

.start-screen{
position:fixed;
inset:0;
z-index:100;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:25px;
text-align:center;
background:
radial-gradient(ellipse at center,rgba(111,48,75,.20),transparent 65%),
linear-gradient(135deg,#100d12,#1c1019 55%,#100d12);
transition:opacity 1s ease,visibility 1s ease;
}

.start-screen.hidden{
opacity:0;
visibility:hidden;
pointer-events:none;
}

.start-heart{
font-size:37px;
color:#f2b5c9;
margin-bottom:24px;
animation:pulse 2s infinite;
}

.start-title{
font-family:'Parisienne',cursive;
font-size:clamp(48px,10vw,76px);
font-weight:400;
color:#f2c0d0;
margin:0 0 12px;
text-shadow:0 0 30px rgba(242,176,200,.3);
}

.start-subtitle{
font-family:Arial,sans-serif;
font-size:12px;
letter-spacing:2px;
color:rgba(255,240,245,.75);
margin-bottom:38px;
}

.start-button{
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.4);
border-radius:50px;
padding:15px 34px;
background:linear-gradient(135deg,#9c4967,#d58ba5);
color:white;
font-family:Arial,sans-serif;
font-size:12px;
letter-spacing:2px;
cursor:pointer;
box-shadow:0 8px 30px rgba(181,83,120,.3);
transition:transform .3s,box-shadow .3s;
}

.start-button:hover{
transform:translateY(-3px) scale(1.04);
box-shadow:0 12px 38px rgba(181,83,120,.5);
}

.start-button span{margin-left:8px}

/* CONTENIDO PRINCIPAL */

.content{
width:min(90%,680px);
padding:35px 20px;
text-align:center;
opacity:0;
transform:translateY(22px);
filter:blur(7px);
transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease;
pointer-events:none;
}

.content.show{
opacity:1;
transform:translateY(0);
filter:blur(0);
pointer-events:auto;
}

.eyebrow{
font-family:Arial,sans-serif;
font-size:10px;
letter-spacing:.34em;
text-transform:uppercase;
color:#f1c4d2;
margin-bottom:24px;
}

.heart{
color:#f2b5c9;
font-size:30px;
display:block;
margin:0 auto 18px;
animation:pulse 2.4s ease-in-out infinite;
}

h1{
font-family:'Parisienne',cursive;
font-weight:400;
font-size:clamp(48px,9vw,78px);
line-height:1.12;
margin:0 auto 20px;
text-shadow:0 3px 28px rgba(0,0,0,.5);
}

h1 span{color:#f2c0d0}

.sub{
font-family:Arial,sans-serif;
font-size:13px;
line-height:1.9;
letter-spacing:.04em;
color:rgba(255,245,248,.93);
max-width:440px;
margin:0 auto;
}

.rule{
height:1px;
width:52px;
background:#e9aebe;
margin:28px auto 0;
opacity:.8;
}

/* CORAZONES FLOTANTES */

.floating-hearts{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
overflow:hidden;
}

.floating-heart{
position:absolute;
bottom:-50px;
color:#f2b5c9;
opacity:0;
animation:floatUp linear forwards;
text-shadow:0 0 12px rgba(242,181,201,.5);
}

/* BOTON DE SONIDO */

.sound{
position:fixed;
bottom:max(26px,env(safe-area-inset-bottom));
left:50%;
transform:translateX(-50%);
z-index:20;
border:1px solid rgba(255,255,255,.42);
background:rgba(18,12,18,.45);
backdrop-filter:blur(12px);
color:#fff;
border-radius:999px;
padding:12px 19px;
font-family:Arial,sans-serif;
font-size:11px;
letter-spacing:.12em;
text-transform:uppercase;
cursor:pointer;
opacity:0;
visibility:hidden;
transition:opacity .8s ease;
}

.sound.visible{
opacity:1;
visibility:visible;
}

.sound span{
color:#f2c0d0;
margin-right:7px;
}

/* ANIMACIONES */

@keyframes pulse{
0%,100%{transform:scale(1);opacity:.85}
50%{transform:scale(1.14);opacity:1}
}

@keyframes floatUp{
0%{transform:translateY(0) rotate(0deg);opacity:0}
10%{opacity:.7}
85%{opacity:.5}
100%{transform:translateY(-110vh) rotate(35deg);opacity:0}
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation:none!important;
transition:none!important;
}
}

@media(max-width:600px){
.content{width:94%;padding:25px 12px}
.start-subtitle{font-size:10px;line-height:1.8}
}
</style>
</head>

<body>

<main class="scene">

<!-- VIDEO -->
<video id="memory" autoplay muted loop playsinline preload="auto" aria-label="Nuestro recuerdo">
<source src="video-boomerang.mp4" type="video/mp4">
</video>

<div class="shade"></div>
<div class="grain"></div>

<!-- CORAZONES -->
<div class="floating-hearts" id="floatingHearts"></div>

<!-- PANTALLA INICIAL -->
<div class="start-screen" id="startScreen">

<div class="start-heart">♡</div>

<h2 class="start-title">Hola, mi amor</h2>

<p class="start-subtitle">
TENGO UN PEQUEÑO DETALLE PARA TI...
</p>

<button class="start-button" id="startBtn">
Abrir mi regalo <span>♡</span>
</button>

</div>

<!-- DEDICATORIA -->
<section class="content" id="content">

<div class="eyebrow">
Un pequeño recuerdo para nosotros
</div>

<span class="heart">♡</span>

<h1>
Feliz primer mes<br>
<span>mi amor ❤️</span>
</h1>

<p class="sub">
Que este sea solo el comienzo de una historia
llena de momentos bonitos. Te elegiría
una y mil veces.
</p>

<div class="rule"></div>

</section>

<!-- SONIDO -->
<button class="sound" id="sound" type="button">
<span>♫</span> Activar sonido
</button>

</main>

<script>
const video = document.getElementById('memory');
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('startScreen');
const content = document.getElementById('content');
const sound = document.getElementById('sound');
const floatingHearts = document.getElementById('floatingHearts');

let started = false;

// BOTON PARA ABRIR LA SORPRESA

startBtn.addEventListener('click', async () => {

if(started) return;
started = true;

startScreen.classList.add('hidden');

content.classList.add('show');

sound.classList.add('visible');

// Reiniciar el video al abrir la sorpresa
video.currentTime = 0;

// Intentar reproducir el video con sonido
video.muted = false;

try{
await video.play();
sound.innerHTML = '<span>♫</span> Silenciar';
}catch(error){
video.muted = true;
try{
await video.play();
}catch(e){}
sound.innerHTML = '<span>♫</span> Activar sonido';
}

// Crear corazones flotantes
iniciarCorazones();

});

// BOTON DE SONIDO

sound.addEventListener('click', async () => {

video.muted = !video.muted;

if(!video.muted){

try{
await video.play();
}catch(error){
video.muted = true;
}

}

sound.innerHTML = video.muted
? '<span>♫</span> Activar sonido'
: '<span>♫</span> Silenciar';

});

// CORAZONES ANIMADOS

function crearCorazon(){

const heart = document.createElement('span');

heart.className = 'floating-heart';
heart.textContent = Math.random() > .5 ? '♡' : '♥';

heart.style.left = Math.random()*100 + 'vw';
heart.style.fontSize = (Math.random()*18+12) + 'px';
heart.style.animationDuration = (Math.random()*7+8) + 's';

floatingHearts.appendChild(heart);

setTimeout(()=>{
heart.remove();
},16000);

}

function iniciarCorazones(){

for(let i=0;i<18;i++){

setTimeout(crearCorazon,i*350);

}

setInterval(crearCorazon,1000);

}

// Intentar mantener el video disponible
video.addEventListener('error',()=>{
console.warn('No se pudo cargar el video.');
});

</script>

</body>
</html>
